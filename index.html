<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Отслеживание геопозиции на карте OSM</title>
    <!-- Подключаем Leaflet CSS и JS -->
    <link rel="stylesheet" href="./lib/leaflet.css" />
    <link rel="stylesheet" href="./style.css">
    <script src="./lib/leaflet.js"></script>
</head>
<body>
    <div class="container">
        <div id="map"></div>
        
        <div class="controls">
            <button class="btn-location" id="getLocationBtn">📍 Моё местоположение</button>
            <button class="btn-track" id="trackLocationBtn">🔄 Отслеживать</button>
        </div>
        
        <div class="info-panel" id="infoPanel">
            <h3>📍 Информация о местоположении</h3>
            <p>Статус: <span id="statusText">Не определено</span></p>
            <p>Широта: <span id="lat" class="coord">—</span></p>
            <p>Долгота: <span id="lng" class="coord">—</span></p>
            <p>Точность: <span id="accuracy">—</span> <span id="accuracyUnit"></span></p>
            <p id="additionalInfo"></p>
        </div>
        
        <div class="status" id="statusMessage">
            💡 Нажмите кнопку для получения геопозиции
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
